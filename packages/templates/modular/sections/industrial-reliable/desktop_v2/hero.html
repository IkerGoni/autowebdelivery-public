<section class="relative w-full h-[600px] flex flex-col justify-end p-lg overflow-hidden border-b-2 border-charcoal max-w-screen-xl mx-auto">
<img class="absolute inset-0 w-full h-full object-cover grayscale brightness-50" data-alt="{{hero_image_alt}}" src="{{hero_image_url}}"/>
<div class="relative z-10 flex flex-col gap-md max-w-2xl">
<h2 class="font-headline-xl text-headline-xl text-white uppercase italic leading-none">{{tagline}}</h2>
<a href="tel:{{phone_raw}}" class="bg-safety-orange border-2 border-charcoal px-lg py-md font-headline-md text-headline-md font-bold text-charcoal w-fit flex items-center justify-center gap-sm active:translate-y-0.5 transition-transform uppercase text-center">
{{cta_copy}}
</a>
</div>
</section>
