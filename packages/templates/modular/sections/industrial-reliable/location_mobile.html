<section class="mechanical-tile flex flex-col overflow-hidden">
<div class="header-strip">
<span class="font-label-sm uppercase">Operational Schedule</span>
</div>
<table class="w-full border-collapse">
<tbody>
<tr class="border-b border-on-surface/10">
<td class="p-sm font-body-md text-right" colspan="2">{{hours}}</td>
</tr>
<tr>
<td class="p-sm font-body-md italic text-secondary text-sm" colspan="2">
                            Contact the shop for current service availability.
                        </td>
</tr>
</tbody>
</table>
</section>
<!-- Map Section -->

<div class="header-strip flex justify-between items-center">
<span class="font-label-sm uppercase">Workshop Location</span>
<span class="font-label-sm">ID: 0492-LOC</span>
</div>
<div class="h-48 bg-surface-dim relative" style="background: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBR67Iv4iGygezE-5IMw-2YVHKWC19g4SPtmVMfTZPaC6xLywadSA7MBuQtYMVX3QElxbnFiLIABmSK-FmJAlND4sLV5DWLfb2Cpv-RJsg3Y09vPnOja2BngzCMjjHLDvvIDVpNeAou0drUdf_ixOAdsM86maKWj8NilHUzcEqiDcvz80DKo7BPACC3sE33qIcTgJo2LliGdTYd9wI6F5btv-raysGfuK2sNFdvTDQjmmfgx0ZjU91tE9iZ4MItfIhPIDDL_hrISV0d') center/cover no-repeat; background-blend-mode: luminosity;">
<iframe

  height="100%" 
  style="border:0;position:absolute;top:0;left:0;width:100%;height:100%;"

  loading="lazy"

</div>
</div>
<div class="p-sm">
<button class="w-full hard-border py-xs font-label-sm uppercase hover:bg-surface-container transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="map">map</span>
                    View on Google Maps
                </button>
</div>
</section>
