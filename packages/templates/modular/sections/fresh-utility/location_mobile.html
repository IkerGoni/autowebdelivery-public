<section class="px-margin-mobile py-section-gap">
<div class="flex flex-col gap-8">
<div class="flex flex-col gap-4">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-forest">Where We Shine</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Serving local neighborhoods with the care and attention you deserve.</p>
</div>
<div class="flex flex-col gap-6">
<div class="flex items-start gap-4">
<div class="p-3 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="schedule">schedule</span>
</div>
<div>
<p class="font-button text-button text-on-surface">Service Hours</p>
<p class="font-body-md text-body-md text-on-surface-variant">{{hours}}</p>
</div>
</div>
<div class="flex items-start gap-4">
<div class="p-3 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
</div>
<div>
<p class="font-button text-button text-on-surface">Coverage Area</p>
<p class="font-body-md text-body-md text-on-surface-variant">Metro Area &amp; Surrounding Suburbs</p>
<a class="text-primary font-button text-button mt-2 inline-block underline decoration-primary-container underline-offset-4" href="#">View Service Map</a>
</div>
</div>
</div>
<!-- Map area -->
<div class="w-full h-48 rounded-2xl overflow-hidden relative soft-shadow" style="background: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAoZIfmHXU-I5cV1xXcvSlynZ4vzBRuEE9iQoXlH2SD6Pvgf31r-pGvSCQplon6wAhP5onVlFSQ3Sp5G-r9kVs6oJgcgD52wOubVYAPEIxNY4rZ5LwYDW8hRIU0N9I_VgQrEs4symE-1h002928EmuILTvJ_6cEqDfdEYLt0ZFZmoljYnlJ83CDEWSs-mgr4C1a3QAFNyDNXBn7KCoIzGznbUSw_VftX3idxOVjiK1C25v5uMu-4ht34UVCvqNbLQwlPb-dcclfuCLf') center/cover no-repeat; background-blend-mode: luminosity;">
<iframe 
  src="https://maps.google.com/maps?q={{address_query}}&output=embed"
  width="100%" 
  height="100%" 
  style="border:0;position:absolute;top:0;left:0;width:100%;height:100%;" 
  allowfullscreen="" 
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-white/90 backdrop-blur px-6 py-3 rounded-full flex items-center gap-2 border border-primary-container">
<span class="material-symbols-outlined text-primary" data-icon="pin_drop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pin_drop</span>
<span class="font-button text-button text-forest">Open in Maps</span>
</div>
</div>
</div>
</div>
</section>
