<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-desktop h-16 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="cleaning_services">cleaning_services</span>
<h1 class="font-display text-headline-md text-primary dark:text-primary-fixed">{{name}}</h1>
</div>
<button class="flex items-center gap-2 bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed px-6 py-2.5 rounded-full font-medium text-sm transition-all hover:shadow-lg hover:scale-[1.02] active:scale-[0.98]" onclick="window.location.href='tel:{{phone_raw}}'">
<span class="material-symbols-outlined text-lg" data-icon="call">call</span>
<span>Call {{phone}}</span>
</button>
</header>
