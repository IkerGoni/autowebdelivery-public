<section class="px-margin-desktop pt-12 pb-section-gap max-w-screen-xl mx-auto">
<div class="flex flex-col gap-6 max-w-2xl">
<div class="inline-flex items-center gap-2 bg-primary-container/20 text-on-primary-container px-4 py-2 rounded-full w-fit">
<span class="material-symbols-outlined text-[18px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-caps text-label-caps">{{rating}} Rating ({{review_count}}+ Reviews)</span>
</div>
<div class="flex flex-col gap-4">
<h2 class="font-display text-display text-primary leading-tight">{{tagline}}</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg">{{hero_description}}</p>
</div>
<div class="flex flex-row gap-3 mt-4">
<button class="bg-primary-container text-on-primary-container font-button text-button py-4 px-10 rounded-xl active:scale-95 transition-all">{{cta_primary}}</button>
<button class="border-2 border-primary-container text-primary font-button text-button py-4 px-10 rounded-xl active:scale-95 transition-all">{{cta_secondary}}</button>
</div>
</div>
<div class="mt-12 rounded-3xl overflow-hidden shadow-[0_10px_30px_rgba(46,125,94,0.05)] aspect-[16/9] relative max-w-4xl">
<img class="w-full h-full object-cover" data-alt="{{hero_image_alt}}" src="{{hero_image_url}}"/>
</div>
</section>
