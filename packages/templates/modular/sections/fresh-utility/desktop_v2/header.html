<header class="bg-surface sticky top-0 z-40 border-b border-outline-variant/30 flex items-center justify-between px-margin-desktop h-16 max-w-screen-xl mx-auto w-full">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-primary hover:bg-surface-variant/50 transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-primary">{{name}}</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer" data-icon="search">search</span>
<a href="tel:{{phone_raw}}" class="bg-primary-container text-on-primary-container font-button text-button px-6 py-2 rounded-full hover:opacity-90 active:scale-95 transition-all">{{cta_copy}}</a>
</div>
</header>
