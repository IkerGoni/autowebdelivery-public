<section class="px-margin-mobile py-section-padding-lg text-center flex flex-col gap-6">
<h2 class="font-headline-md text-secondary">Personal Consultations</h2>
<p class="font-body-md text-on-surface-variant max-w-xs mx-auto">Speak with our specialists to design your custom treatment journey.</p>
<a class="text-display-lg text-primary font-display-lg block hover:scale-105 transition-transform duration-300" href="tel:{{phone_raw}}">
                {{phone}}
            </a>
{{#has_booking}}
<a class="bg-on-primary/10 backdrop-blur-md border border-on-primary text-on-primary px-lg py-md rounded-sm font-headline-sm text-headline-sm hover:bg-on-primary/20 transition-all inline-flex items-center justify-center gap-2 mt-2" href="{{booking_url}}" target="_blank" rel="noopener">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
                {{booking_label}}
            </a>
{{/has_booking}}

<!-- Contact Form -->
<div class="w-full mt-4 border-t border-outline/20 pt-6">
<h3 class="font-headline-sm text-headline-sm mb-4 text-on-surface">Send a Message</h3>
<form action="mailto:business@email.com" method="post" enctype="text/plain" class="flex flex-col gap-4 text-left">
<input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline/30 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30">
<input type="tel" name="phone" placeholder="{{phone}}" class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline/30 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30">
<input type="email" name="email" placeholder="your@email.com" required class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline/30 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30">
<textarea name="message" placeholder="Tell us about your goals..." rows="4" required class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline/30 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none"></textarea>
<button type="submit" class="bg-primary text-on-primary px-6 py-3 rounded-lg font-headline-sm text-headline-sm hover:opacity-90 transition-opacity w-full">
                    Submit
                </button>
</form>
</div>
<!-- /Contact Form -->

</section>
</main>
