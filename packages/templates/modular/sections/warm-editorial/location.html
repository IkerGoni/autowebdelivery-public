<section class="py-section-padding-lg">
<div class="max-w-container-max mx-auto px-margin-mobile">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-section-padding-sm items-center">
<div>
<h2 class="font-headline-md text-headline-md text-secondary mb-6">Visit Our Sanctuary</h2>
<p class="text-on-surface-variant mb-8 leading-relaxed">Our studio provides a discrete and tranquil escape from the city's pulse.</p>
<div class="space-y-6">
<div class="flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-1">location_on</span>
<div>
<div class="font-label-caps text-label-caps text-primary mb-1">LOCATION</div>
<p class="text-on-surface">{{full_address_html}}</p>
</div>
</div>
<div class="flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-1">schedule</span>
<div>
<div class="font-label-caps text-label-caps text-primary mb-1">HOURS</div>
<p class="text-on-surface">{{hours}}</p>
</div>
</div>
</div>
</div>
<div class="h-[400px] bg-surface-container rounded-2xl overflow-hidden shadow-sm relative border border-outline-variant/10">
<!-- Map area -->
  <div class="absolute inset-0 flex items-center justify-center" style="background: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBKXXBVfJRtKjntS2iHGDn1kVyo0h9d-aggsuEgLnuhokwVoUNqORqtv5gPhvOlpTb54Tr0PSWKvRQK5c2N7uRB-sc8DSqLip00PwPUMf7BSCHUNdiW7nf0kdV6ZuQRHQA17XGwS_PbfV83oK049XXbYj0wUeeMNDXDcsWqX7w81ubyI-l_ghYiyXNxJkoZQNiNcjRRrHpblPrKCRVJ1NFINOsM49EKUCQb0eqgsUgZFqdWMOF5c1hOFlVct4ddkqDgIV9kP9GaGE4') center/cover no-repeat; background-blend-mode: multiply;">
    <iframe 
      src="https://maps.google.com/maps?q={{address_query}}&output=embed"
      width="100%" 
      height="100%" 
      style="border:0;position:absolute;top:0;left:0;width:100%;height:100%;" 
      allowfullscreen="" 
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
<div class="absolute flex flex-col items-center">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-on-primary shadow-xl animate-pulse">
<span class="material-symbols-outlined">location_on</span>
</div>
<div class="bg-white px-4 py-2 rounded-lg mt-2 shadow-sm font-label-caps text-[10px] tracking-widest text-primary">{{name}}</div>
</div>
</div>
</div>
</div>
</div>
</section>
