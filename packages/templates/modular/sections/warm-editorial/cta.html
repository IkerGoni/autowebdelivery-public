<section class="bg-primary text-on-primary py-section-padding-lg text-center">
<div class="max-w-3xl mx-auto px-margin-mobile">
<h2 class="font-headline-md text-headline-md mb-6">Begin Your Transformation</h2>
<p class="font-body-lg text-body-lg mb-10 opacity-90">Our specialists are available for personalized consultations to curate a regimen tailored to your aspirations.</p>
<div class="flex flex-col items-center gap-4">
<a class="font-display-lg text-headline-md md:text-headline-md hover:underline decoration-1 underline-offset-8" href="tel:{{phone_raw}}">
                        {{phone}}
                    </a>
<div class="font-label-caps text-label-caps tracking-widest mt-2">TELEPHONE CONSULTATIONS</div>
{{#has_booking}}
<a class="bg-on-primary/10 backdrop-blur-md border border-on-primary text-on-primary px-lg py-md rounded-sm font-headline-sm text-headline-sm hover:bg-on-primary/20 transition-all inline-flex items-center justify-center gap-2 mt-4" href="{{booking_url}}" target="_blank" rel="noopener">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
                    {{booking_label}}
                </a>
{{/has_booking}}
</div>

<!-- Contact Form -->
<div class="mt-12 max-w-lg mx-auto border-t border-on-primary/20 pt-10">
<h3 class="font-headline-sm text-headline-sm mb-6">Or Send Us a Note</h3>
<form action="mailto:business@email.com" method="post" enctype="text/plain" class="flex flex-col gap-5 text-left">
<input type="text" name="name" placeholder="Your Name" required class="w-full px-5 py-4 rounded-sm bg-white/10 backdrop-blur-md border border-white/20 text-on-primary placeholder:text-on-primary/50 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-on-primary/50">
<input type="tel" name="phone" placeholder="{{phone}}" class="w-full px-5 py-4 rounded-sm bg-white/10 backdrop-blur-md border border-white/20 text-on-primary placeholder:text-on-primary/50 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-on-primary/50">
<input type="email" name="email" placeholder="your@email.com" required class="w-full px-5 py-4 rounded-sm bg-white/10 backdrop-blur-md border border-white/20 text-on-primary placeholder:text-on-primary/50 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-on-primary/50">
<textarea name="message" placeholder="Tell us about your goals..." rows="4" required class="w-full px-5 py-4 rounded-sm bg-white/10 backdrop-blur-md border border-white/20 text-on-primary placeholder:text-on-primary/50 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-on-primary/50 resize-none"></textarea>
<button type="submit" class="bg-on-primary text-primary px-8 py-4 rounded-sm font-headline-sm text-headline-sm tracking-wider hover:opacity-90 transition-opacity w-full sm:w-auto">
                        Submit Inquiry
                    </button>
</form>
</div>
<!-- /Contact Form -->

</div>
</section>
</main>
