<section class="py-xl">
<div class="max-w-container-max mx-auto px-gutter">
<div class="bg-secondary p-lg rounded-xl flex flex-col md:flex-row items-center justify-between text-on-secondary gap-lg">
<div class="text-center md:text-left">
<h2 class="font-headline-md text-headline-md mb-xs">{{trust_badge}}</h2>
<p class="font-body-md text-body-md text-secondary-fixed opacity-80">Proudly serving the local healthcare community.</p>
</div>
<div class="flex gap-lg items-center">
<div class="text-center">
<div class="font-display-lg text-display-lg text-primary-fixed">{{rating}}</div>
<div class="flex justify-center text-primary-fixed mb-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star_half</span>
</div>
<div class="font-label-sm text-label-sm uppercase tracking-widest">Google Rating</div>
</div>
<div class="h-20 w-px bg-on-secondary/20 hidden md:block"></div>
<div class="text-center">
<div class="font-display-lg text-display-lg text-primary-fixed">{{review_count}}+</div>
<div class="font-label-sm text-label-sm uppercase tracking-widest mt-4">Verified Reviews</div>
</div>
</div>
</div>
</div>
</section>
