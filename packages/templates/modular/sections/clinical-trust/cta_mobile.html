<section class="px-gutter py-xl">
<div class="bg-primary-container rounded-3xl p-8 text-center flex flex-col items-center gap-6 shadow-lg">
<h2 class="font-headline-md text-headline-md text-on-primary-container">Ready for a brighter smile?</h2>
<p class="font-body-md text-body-md text-on-primary-container/80 max-w-xs">Our team is ready to provide you with the professional care you deserve.</p>
<div class="flex flex-col w-full gap-3">
<a class="bg-on-primary-container text-on-primary px-gutter py-4 rounded-xl font-headline-sm flex items-center justify-center gap-3" href="tel:{{phone_raw}}">
<span class="material-symbols-outlined" data-icon="call">call</span>
                        {{phone}}
                    </a>
{{#has_booking}}
<a class="bg-on-primary-container text-on-primary px-gutter py-4 rounded-xl font-headline-sm flex items-center justify-center gap-3" href="{{booking_url}}" target="_blank" rel="noopener">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
                        {{booking_label}}
                    </a>
{{/has_booking}}
</div>

<!-- Contact Form -->
<div class="w-full mt-4">
<h3 class="font-headline-sm text-headline-sm mb-4 text-on-primary-container/80">Send Us a Message</h3>
<form action="mailto:business@email.com" method="post" enctype="text/plain" class="flex flex-col gap-4 text-left">
<input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-on-primary-container placeholder:text-on-primary-container/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-on-primary-container/50">
<input type="tel" name="phone" placeholder="{{phone}}" class="w-full px-4 py-3 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-on-primary-container placeholder:text-on-primary-container/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-on-primary-container/50">
<input type="email" name="email" placeholder="your@email.com" required class="w-full px-4 py-3 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-on-primary-container placeholder:text-on-primary-container/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-on-primary-container/50">
<textarea name="message" placeholder="How can we help you?" rows="4" required class="w-full px-4 py-3 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-on-primary-container placeholder:text-on-primary-container/60 font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-on-primary-container/50 resize-none"></textarea>
<button type="submit" class="bg-on-primary-container text-on-primary px-6 py-3 rounded-xl font-headline-sm text-headline-sm hover:opacity-90 transition-opacity w-full">
                        Send Message
                    </button>
</form>
</div>
<!-- /Contact Form -->

</div>
</section>
</main>
