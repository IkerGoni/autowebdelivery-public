<section class="py-xl bg-background">
<div class="max-w-container-max mx-auto px-gutter grid grid-cols-1 lg:grid-cols-2 gap-lg items-stretch">
<div class="bg-white p-lg rounded-xl shadow-sm border border-surface-container-high">
<h2 class="font-headline-md text-headline-md text-on-surface mb-lg">Visit Our Clinic</h2>
<div class="space-y-lg">
<div class="flex items-start gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary">location_on</span>
</div>
<div>

</div>

</ul>

</div>
</div>

</div>

</div>

<a class="text-primary font-bold hover:underline" href="#">Open in Google Maps</a>

</div>
</div>
