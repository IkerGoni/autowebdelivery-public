<section class="py-xl bg-background">
<div class="max-w-container-max mx-auto px-gutter grid grid-cols-1 lg:grid-cols-2 gap-lg items-stretch">
<div class="bg-white p-lg rounded-xl shadow-sm border border-surface-container-high">
<h2 class="font-headline-md text-headline-md text-on-surface mb-lg">Visit Our Clinic</h2>
<div class="space-y-lg">
<div class="flex items-start gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary">location_on</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface mb-xs">Location</h4>
<p class="font-body-md text-body-md text-on-surface-variant">{{full_address_html}}</p>
</div>
</div>
<div class="flex items-start gap-md">
            <div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-primary">schedule</span>
            </div>
            <div>
            <h4 class="font-label-md text-label-md text-on-surface mb-xs">Clinic Hours</h4>
            <div class="space-y-xs">
            <p class="font-body-md text-body-md text-on-surface-variant">{{hours_weekdays}}: {{hours_weekday_hours}}</p>
            <p class="font-body-md text-body-md text-on-surface-variant">{{hours_weekend_day}}: {{hours_weekend_hours}}</p>
            {{#hours_note}}<p class="font-body-sm text-body-sm text-on-surface-variant">{{hours_note}}</p>{{/hours_note}}
            </div>
            </div>
            </div>
</div>
<div class="mt-lg pt-lg border-t border-surface-container-high">
<button class="w-full flex items-center justify-center gap-sm bg-surface-container text-on-surface px-lg py-md rounded-lg font-label-md text-label-md hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">directions</span>
                            Get Directions
                        </button>
</div>
</div>
<div class="rounded-xl overflow-hidden shadow-sm border border-surface-container-high min-h-[400px] relative">
  <!-- Map area -->
  <div class="w-full h-full relative flex items-center justify-center overflow-hidden" style="background: linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.1)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuA3LaywF_RUnoEgJFTeP3ztg4iFSx3erTLE5F1VTpBXokz3kR6WJq90_EMRu0nd7gtCGoLj3JKoqk2ggUCycc5B67aK-e5kqN3r8Yxyu6irORG-NkmzHGHHs19JmrVpGBUaHSS2Jf9ykW_qmcVhY9HxcKtmKmMkzOUA6iYk3SriqO4KoPeCvjyWSvfc-Zy7275lBAhtJQcls59PjCTps19DnSNnlWAwNuANoZ-e173n5mCdtTPzLBMjfhqkG-IJAeKD804gXFZWl7I') center/cover no-repeat; background-blend-mode: luminosity;">
    <iframe 
      src="https://maps.google.com/maps?q={{address_query}}&output=embed"
      width="100%" 
      height="100%" 
      style="border:0;position:absolute;top:0;left:0;width:100%;height:100%;" 
      allowfullscreen="" 
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
<div class="z-10 bg-white p-lg rounded-xl shadow-2xl flex flex-col items-center max-w-xs text-center border border-primary/20">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center mb-md text-white">
<span class="material-symbols-outlined">home_health</span>
</div>
<h4 class="font-headline-sm text-headline-sm text-on-surface mb-xs">{{name}}</h4>
<p class="font-body-md text-body-md text-on-surface-variant mb-md">{{address_line1}}</p>
<a class="text-primary font-bold hover:underline" href="#">Open in Google Maps</a>
</div>
</div>
</div>
</div>
</section>
