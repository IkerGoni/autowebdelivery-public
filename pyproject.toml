[project]
name = "autoweb-pipeline"
version = "0.1.0"
description = "Auto Web Delivery Pipeline - Phase-based lead generation and site deployment"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "pipeline*", "phases*", "deployers*", "modular*", "templates*", "discovery*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "runs",
]
