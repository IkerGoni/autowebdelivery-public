[project]
name = "autoweb-pipeline"
version = "0.1.0"
description = "Auto Web Delivery Pipeline - Phase-based lead generation and site deployment"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "pipeline*", "phases*", "deployers*", "modular*", "templates*", "discovery*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "runs",
]

[tool.ruff.lint.per-file-ignores]
# E402: standalone CLI bootstrap — sys.path se inserta ANTES de importar
# templates.modular para poder ejecutarse sin instalación editable
# (python -m templates.modular.cli). Deliberado, ver docstring del módulo.
"packages/templates/modular/cli.py" = ["E402"]
# Blind except / try-except-pass DELIBERADO en código de red y IO externo
# (fetchers, enriquecedores, phases con resiliencia ante APIs de terceros).
# Los ficheros NO listados deben refactorizar sus BLE001/S110.
"packages/discovery/maps_fetcher.py" = ["BLE001"]
"packages/discovery/social_detection.py" = ["BLE001"]
"packages/enrichment/image_fallback.py" = ["BLE001"]
"packages/enrichment/social_scraper.py" = ["BLE001"]
"packages/generation/stitch_adapter.py" = ["BLE001"]
"packages/generation/stitch_premium_adapter.py" = ["BLE001"]
"packages/deployers/vercel.py" = ["BLE001"]
"packages/phases/phase_02_basic_lead_discovery.py" = ["BLE001", "S110"]
"packages/phases/phase_02_1_website_filter.py" = ["BLE001"]
"packages/phases/phase_04_7_brand.py" = ["BLE001"]
"packages/phases/phase_05_5_browser_render_capture.py" = ["BLE001"]
"packages/phases/phase_05_modular_site_generation.py" = ["BLE001", "EXE001"]
"packages/phases/phase_05_preview_site_generation.py" = ["BLE001", "PLW0127"]
"packages/phases/phase_05_unified.py" = ["BLE001", "SIM115", "TRY002"]
"packages/phases/phase_06_quality_gate.py" = ["BLE001", "SIM117"]
