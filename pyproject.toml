[project]
name = "autoweb-pipeline"
version = "0.1.0"
description = "Auto Web Delivery Pipeline - Phase-based lead generation and site deployment"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "pipeline*", "phases*", "deployers*", "modular*", "templates*", "discovery*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "runs",
]

[tool.ruff.lint.per-file-ignores]
# E402: standalone CLI bootstrap — sys.path se inserta ANTES de importar
# templates.modular para poder ejecutarse sin instalación editable
# (python -m templates.modular.cli). Deliberado, ver docstring del módulo.
"packages/templates/modular/cli.py" = ["E402"]
# ---------------------------------------------------------------------------
# TERMINAL BLE001/S110 ALLOWLIST (R0-04, F-01) — do not grow this list.
#
# Each entry is a network/IO resilience module where a broad `except Exception`
# is the documented failure-isolation boundary against third-party APIs,
# browsers or loop-level per-item processing. Every other file must type its
# exceptions (a 2026-02 R0 sweep removed 7 files from this list by narrowing
# urlparse/json/subprocess catches to ValueError/OSError/SubprocessError).
# Adding a file here requires a recovery-plan story; removing one requires
# typing every catch it contained.
# ---------------------------------------------------------------------------
"packages/discovery/maps_fetcher.py" = ["BLE001"]                    # Google Places API retry loop
"packages/enrichment/image_fallback.py" = ["BLE001"]                 # per-image generator loop
"packages/generation/stitch_adapter.py" = ["BLE001"]                 # Stitch API calls
"packages/generation/stitch_premium_adapter.py" = ["BLE001"]         # Stitch API calls
"packages/phases/phase_02_basic_lead_discovery.py" = ["BLE001", "S110"]  # Places API paging loop
"packages/phases/phase_04_7_brand.py" = ["BLE001"]                   # per-lead brand loop
"packages/phases/phase_05_5_browser_render_capture.py" = ["BLE001"]  # Playwright degradation
"packages/phases/phase_05_modular_site_generation.py" = ["BLE001", "EXE001"]
"packages/phases/phase_05_preview_site_generation.py" = ["BLE001", "PLW0127"]  # browser capture degradation
"packages/phases/phase_05_unified.py" = ["BLE001", "SIM115", "TRY002"]
"packages/phases/phase_06_quality_gate.py" = ["BLE001", "SIM117"]
"packages/phases/phase_07_deployment.py" = ["BLE001", "S110", "SIM117", "SIM115", "TRY002"]  # deploy loop
"packages/pipeline/run_pipeline.py" = ["BLE001", "S110", "SIM102"]   # phase-runner isolation
"packages/pipeline/vnext_integration.py" = ["BLE001", "S110", "LOG015", "RUF012"]  # flag isolation: vnext failure must not kill legacy pipeline
